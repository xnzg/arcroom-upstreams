name: libsmb2

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: libsmb2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # The tvOS 26 and visionOS 26 floors need the Xcode the current image
    # ships; this is the label the ffmpeg job already proves against.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.5

      - run: deno fmt --check
      - run: deno lint
      - run: deno check tools/libsmb2/build.ts tools/libsmb2/verify.ts

      - name: Build the artifact
        run: deno task libsmb2-build --out dist-libsmb2

      # Independent of the build's own staging checks: this expands the zips as
      # a consumer would and asserts, for every slice, the structure, the
      # bundle layout, the plists, LC_BUILD_VERSION, the install name, the
      # signature, module importability, and that the macOS slice loads.
      - name: Verify the artifact
        run: deno task libsmb2-verify dist-libsmb2

      - name: Checksums
        working-directory: dist-libsmb2
        run: shasum -a 256 *.zip *-source.tar.gz | tee SHA256SUMS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: libsmb2-apple-arm64
          path: |
            dist-libsmb2/*.zip
            dist-libsmb2/*-source.tar.gz
            dist-libsmb2/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
