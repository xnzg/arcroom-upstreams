name: ffmpeg

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    # macos-latest is Apple silicon; every slice of the artifact is arm64.
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno fmt --check
      - run: deno lint
      - run: deno check tools/ffmpeg/build.ts tools/ffmpeg/verify.ts

      - name: Build the artifact
        run: deno task ffmpeg-build --out dist-ffmpeg

      # Independent of the build's own staging checks: this expands the six
      # zips as a consumer would and asserts, for every slice, the structure,
      # install names, plists, LC_BUILD_VERSION platform, signatures, and module
      # importability.
      - name: Verify the artifact
        run: deno task ffmpeg-verify dist-ffmpeg

      - name: Checksums
        working-directory: dist-ffmpeg
        run: shasum -a 256 *.zip | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-apple-arm64
          path: dist-ffmpeg/*
          if-no-files-found: error
          retention-days: 14
